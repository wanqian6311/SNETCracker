name: Build SNETCracker

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.2.0

    # 核心修复：安装 .NET Framework 4.0 Developer Pack
    - name: Install .NET Framework 4.0 Developer Pack
      run: choco install netfx-4.0-devpack -y

    - name: Restore NuGet packages
      run: nuget restore SNETCracker.sln

    - name: Build Solution
      run: msbuild SNETCracker.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SNETCracker-Release
        path: SNETCracker\bin\Release\
